<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Tablero NxN</title>
  <link rel="stylesheet" href="css/appColors.css">
  <link rel="stylesheet" href="css/appFonts.css">
  <link rel="stylesheet" href="css/appStyles.css">
</head>
<body>

  <header>
    <h1 data-element="title">Juego de Tablero</h1>
    
    <div class="header-actions">
      <button type="button" data-action="toggle-menu">
        Configuración
      </button>

      <button type="button" data-action="help" data-has-tooltip>
        Mecánica del Juego
        <span class="tooltip-help">Intercambia fichas para completar filas del mismo tipo</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <aside class="panel-controls" data-element="controls-panel" data-state="collapsed">
      <div class="panel-controls-header">
        <h2>Configuración</h2>
        <button type="button" data-action="close-menu" aria-label="Cerrar configuración">✕</button>
      </div>

      <div class="control-group">
        <label for="select-size">Dimensión (N x N):</label>
        <input type="number" id="select-size" min="3" max="8" value="3" data-control="board-size">
      </div>

      <div class="control-group">
        <label for="select-piece-size">Tamaño de Fichas:</label>
        <select id="select-piece-size" data-control="piece-size">
          <option value="small">Pequeña</option>
          <option value="medium" selected>Mediana</option>
          <option value="large">Grande</option>
        </select>
      </div>

      <div class="control-group">
        <label for="select-piece-shape">Forma de Fichas:</label>
        <select id="select-piece-shape" data-control="piece-shape">
          <option value="circle" selected>Círculo</option>
          <option value="square">Cuadrado</option>
          <option value="rounded">Bordes Redondeados</option>
        </select>
      </div>

      <div class="control-group">
        <label for="range-hue">Tono Cromático:</label>
        <input type="range" id="range-hue" min="0" max="360" value="210" data-control="hue">
      </div>

      <button type="button" data-action="restart">Nueva Partida</button>
    </aside>

    <section class="panel-game">
      <div class="board-grid" id="board" data-element="board"></div>
      
      <article class="help-card" data-element="help-info" hidden>
        <h3>Instrucciones de Juego</h3>
        <p>Arrastra una ficha y suéltala sobre otra celda para intercambiar sus posiciones.</p>
        <p>El juego concluye con éxito cuando todas las celdas de cada fila contengan fichas del mismo tipo.</p>
      </article>
    </section>
  </main>

  <footer>
    <p data-element="status">Partida en curso</p>
  </footer>

  <script type="module" src="js/controllers/appController.js"></script>
</body>
</html>
